name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npm test

  validate:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Validate JSON configuration files
        run: |
          for file in vercel.json site.webmanifest package.json firebase.json database.rules.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" \
              && echo "ok  $file" \
              || { echo "INVALID  $file"; exit 1; }
          done

      - name: Validate sitemap XML
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml'); print('ok  sitemap.xml')"

      - name: Validate JSON-LD structured data
        run: node tools/check-structured-data.js

      - name: Check internal links resolve
        run: node tools/check-links.js
