<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f766e" />
    <title>Seedwel Workplace</title>
    <meta name="description" content="Private Seedwel workplace portal." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/private-portal.css" />
    <link rel="stylesheet" href="/assets/css/workplace.css" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="/assets/js/firebase-config.js"></script>
    <script src="/assets/js/recruitment-utils.js"></script>
    <script src="/assets/js/workflow.js"></script>
    <script src="/assets/js/portal-shared.js"></script>
</head>
<body class="portal-auth wp-auth">
    <main class="auth-main">
        <section class="auth-card" aria-labelledby="portalTitle">
            <div class="auth-head">
                <img src="https://i.ibb.co/svxj52ny/seedwel.png" alt="Seedwel logo" />
                <p class="auth-eyebrow">Seedwel Workplace</p>
                <h1 id="portalTitle">Opening your workspace…</h1>
                <p>We are checking your account role and taking you to the right dashboard.</p>
            </div>
            <div class="auth-body">
                <div class="banner info"><i class="fa-solid fa-spinner fa-spin"></i> One moment, please.</div>
                <div class="auth-actions">
                    <a class="btn btn-secondary" href="/login"><i class="fa-solid fa-right-to-bracket"></i> Go to Login</a>
                    <a class="btn btn-secondary" href="/"><i class="fa-solid fa-arrow-left"></i> Back to site</a>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            'use strict';
            var portal = window.SeedwelPortal;
            portal.auth.setPersistence(window.firebase.auth.Auth.Persistence.LOCAL)
                .catch(function () { return portal.auth.setPersistence(window.firebase.auth.Auth.Persistence.SESSION); })
                .finally(function () {
                    portal.auth.onAuthStateChanged(function (user) {
                        if (!user) { window.location.href = '/login'; return; }
                        portal.routeUser(user).catch(function (error) {
                            console.error(error);
                            window.location.href = '/login';
                        });
                    });
                });
        })();
    </script>
</body>
</html>
